<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANHS · Atelier des personnages</title><link rel="stylesheet" href="styles.css"><style>body{overflow:auto;background:#162932}main{max-width:1350px;margin:auto;padding:25px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font:32px 'Libre Caslon Display',Georgia;margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools select{background:#273e47;border:1px solid #b9aa7e55;color:#dacfaf;padding:10px;border-radius:3px}.tools button{padding:10px 14px;background:#273e47;border:1px solid #b9aa7e55;border-radius:3px;color:#dacfaf;font-size:11px}button[aria-pressed=true]{background:#8f3e51;color:#f8e9cf}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.actor-card{position:relative;border:1px solid #b8ac883d;background:#1b303a;border-radius:3px;overflow:hidden}.actor-card header{display:flex;padding:14px 17px;margin:0;border-bottom:1px solid #b8ac8822}.actor-card b{font-size:12px;font-weight:500;color:#e3d1ad}.actor-card small{font-size:8px;color:#9ab0a1}.actor-card canvas{display:block;width:100%;height:190px}.labels{display:flex;justify-content:space-around;font-size:8px;letter-spacing:1.2px;color:#9fae9a;padding:0 10px 12px}footer{color:#96aa9e;font-size:10px;line-height:1.9;margin:20px 0}.status{font-size:10px;color:#c7b894;white-space:nowrap}.effects-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}a{color:#dbc99e;font-size:11px}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}@media(max-width:500px){#grid{grid-template-columns:1fr}}</style></head><body><main><header><div><span class="eyebrow">ANHS · VERSION 0.2</span><h1>Les personnages prennent vie.</h1><span class="status" id="status">Chargement des planches…</span></div><div class="tools"><select id="direction" aria-label="Direction"><option value="down">Face</option><option value="left">Gauche</option><option value="right">Droite</option><option value="up">Dos</option></select><button data-state="walk" aria-pressed="true">Marche</button><button data-state="run" aria-pressed="false">Course</button><button data-state="idle" aria-pressed="false">Attente</button><button data-state="talk" aria-pressed="false">Dialogue</button></div></header><section id="grid" aria-label="Personnages animés"></section><div class="tools effects-row"><button data-fx="success">Réussite</button><button data-fx="trust">Confiance</button><button data-fx="knowledge">Découverte</button><button data-fx="train">Entraînement</button><button id="soft" aria-pressed="false">Effets doux</button></div><footer>Chaque image contient un seul personnage. Quatre images de marche et une pose debout par direction sont chargées séparément.<br><a href="./">← Revenir au jeu</a></footer></main><script type="module" src="atelier.mjs"></script></body></html>
